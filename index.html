<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/logo.png" />
    <link rel="apple-touch-icon" href="/assets/logo.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    
    <!-- Theme & Mobile UX -->
    <meta name="theme-color" content="#065f46" />
    <meta name="color-scheme" content="light dark" />
    <meta name="format-detection" content="telephone=yes" />

    <!-- Resource Hints & DNS Prefetches for High Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />

    <!-- High-Priority LCP Hero Image Preload -->
    <link rel="preload" as="image" href="/assets/hero-banner.jpg" fetchpriority="high" />

    <!-- Google Fonts Optimized Asynchronous Loading (Eliminates CSS @import waterfall) -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&display=swap" />

    <!-- Security Headers (Meta Level Fallback) -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' https: wss:;" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(), payment=()" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />

    <!-- Primary Search Engine Metadata -->
    <title>Med360 — Specialised Medical Care | Owned by NGO Enn Rev Enn Sourir</title>
    <meta name="description" content="Med360 connects patients with premier accredited hospitals in India, Thailand, and private clinics. Owned by NGO Enn Rev Enn Sourir with 100% of profits returned to fund medical care for the needy." />
    <meta name="keywords" content="Med360, medical tourism Mauritius, hospital India, Apollo Hospital, Fortis Healthcare, medical concierge Mauritius, second opinion, cancer treatment India, cardiac surgery, robotic urology, IVF abroad, organ transplant, medical travel insurance, Enn Rev Enn Sourir" />
    <meta name="author" content="Med360 Mauritius" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

    <!-- Global Open Graph (Facebook / LinkedIn / WhatsApp) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Med360" />
    <meta property="og:title" content="Med360 — Specialised Medical Care | Owned by NGO Enn Rev Enn Sourir" />
    <meta property="og:description" content="Connect with world-class accredited hospitals in India, Thailand & private clinics. Owned by NGO Enn Rev Enn Sourir with 100% profits funding medical care for the needy." />
    <meta property="og:url" content="https://medical360-zeta.vercel.app/" />
    <meta property="og:image" content="https://medical360-zeta.vercel.app/assets/banners/home_banner.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Med360 International Healthcare Concierge" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="fr_FR" />

    <!-- Global Twitter Card Protocol -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@Med360Mu" />
    <meta name="twitter:creator" content="@Med360Mu" />
    <meta name="twitter:title" content="Med360 — Specialised Medical Care | Owned by NGO Enn Rev Enn Sourir" />
    <meta name="twitter:description" content="Connect with world-class accredited hospitals in India, Thailand & private clinics. Free medical opinion and full concierge support." />
    <meta name="twitter:image" content="https://medical360-zeta.vercel.app/assets/banners/home_banner.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
